version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whiteeyes_postgres
    restart: always
    environment:
      POSTGRES_DB: whiteeyes
      POSTGRES_USER: whiteeyes_user
      POSTGRES_PASSWORD: whiteeyes_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whiteeyes_backend
    restart: always
    environment:
      PORT: 8080
      APP_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://whiteeyes_user:whiteeyes_password@postgres:5432/whiteeyes?sslmode=disable
      JWT_SECRET: whiteeyes-prod-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      STORAGE_BACKEND: local
      UPLOAD_DIR: ./uploads
      UPLOAD_BASE_URL: http://localhost:8080/uploads
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whiteeyes_frontend
    restart: always
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
      API_BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
